name: workkit
description: Free, local-first productivity tools for everyday work.
publish_to: "none"
version: 1.0.0+8

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  share_plus: ^12.0.2
  doc_scan_flutter: ^2.0.0
  google_mlkit_text_recognition: ^0.16.0
  pdf_manipulator: 4.1.0
  signature: ^6.4.0
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0
  image: ^4.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.3

flutter:
  uses-material-design: true
