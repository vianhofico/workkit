name: Cleanup legacy branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'chore: remove legacy agent branches' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Delete obsolete agent branches
        run: |
          set -euo pipefail
          branches=(
            'agent/bootstrap-workkit-foundation'
            'agent/bootstrap-workkit-foundation-ci'
            'agent/bootstrap-workkit-foundation-final'
            'agent/bootstrap-workkit-foundation-stage'
            'agent/bootstrap-workkit-foundation-tree'
            'agent/bootstrap-workkit-foundation-v2'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

      - name: Verify legacy branches are gone
        run: |
          set -euo pipefail
          if git ls-remote --heads origin 'refs/heads/agent/*' | grep -q .; then
            echo '::error::Legacy agent/* branches still exist.'
            exit 1
          fi
          echo 'No agent/* branches remain.'
