name: Publish GitHub Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'chore(release): publish WorkKit v1.1.0' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android and iOS projects
        run: dart run tool/bootstrap_platforms.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Generate launcher source
        run: dart run tool/generate_launcher_source.dart

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Generate Drift code
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Prepare release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk WorkKit-v1.1.0-android.apk

      - name: Publish GitHub Release v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists; skipping creation."
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          # WorkKit v1.1.0

          Bản phát hành WorkKit 1.1.0 tập trung vào trải nghiệm người dùng Việt Nam và nhận diện sản phẩm hoàn chỉnh.

          ## Điểm mới
          - Hỗ trợ đầy đủ giao diện **Tiếng Việt** và **English**.
          - Hỗ trợ chế độ **Theo ngôn ngữ hệ thống**.
          - Có thể đổi ngôn ngữ ngay trong ứng dụng mà không cần khởi động lại.
          - Lưu lựa chọn ngôn ngữ cục bộ trên thiết bị.
          - Chuẩn hóa tên hiển thị ứng dụng thành **WorkKit** trên Android/iOS.
          - Tích hợp launcher icon WorkKit mới.
          - Giữ nguyên toàn bộ bộ công cụ: Scanner, OCR, PDF, chữ ký, QR, xử lý ảnh, thư viện và backup/restore.

          ## Cài đặt Android
          Tải file **WorkKit-v1.1.0-android.apk** trong phần Assets và mở file trên điện thoại Android để cài đặt.

          > Đây là APK release dành cho cài đặt trực tiếp và thử nghiệm ngoài Google Play. Bản phát hành Play Store vẫn cần upload signing key/Play Console riêng.
          EOF

          gh release create v1.1.0 \
            WorkKit-v1.1.0-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WorkKit v1.1.0" \
            --notes-file release-notes.md
